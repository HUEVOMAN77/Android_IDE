name: NovaIDE build

on:
  workflow_dispatch:
    inputs:
      upload_assets_zip:
        description: "Subir también el zip de assets (1.1 GB) que la APK debug necesita en el teléfono"
        type: boolean
        default: true
      publish_release:
        description: "Publicar una release con la APK y el zip de assets"
        type: boolean
        default: false
      release_tag:
        description: "Etiqueta de la release (solo si se publica)"
        type: string
        default: "v0.1.0"
  push:
    branches:
      - "novaide/**"
    tags:
      - "v*"

concurrency:
  group: novaide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK arm64 debug
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      INCLUDE_LLAMA_ASSETS: "false"
      ANDROID_SDK_PACKAGES: "platforms;android-36 build-tools;36.0.0 cmake;3.31.6 platform-tools ndk;29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No borrar /usr/local/lib/android: es root y setup-android, que corre sin root,
      # no puede recrearlo. El SDK preinstalado se reutiliza.
      - name: Liberar disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El default del action instala el paquete "tools", que Google ya retiró del
      # repositorio SDK y hace fallar a sdkmanager con exit 1.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_SDK_PACKAGES }}

      - name: Paquetes del SDK y NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager $ANDROID_SDK_PACKAGES
          sdkmanager --list_installed

      - name: Caché de assets del upstream
        uses: actions/cache@v4
        with:
          path: |
            assets/*.zip
            assets/documentation.db
          key: novaide-debug-assets-v1
          restore-keys: novaide-debug-assets-

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: novaide-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: novaide-gradle-

      # El gradle.properties del proyecto pide 8 GB de heap y 30 workers, pensado para
      # las máquinas self-hosted del upstream. En GRADLE_USER_HOME tiene precedencia.
      - name: Ajustar memoria al runner de 16 GB
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options="-Xmx3g" -XX:+HeapDumpOnOutOfMemoryError --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          android.aapt2.daemonHeapSize=3072M
          EOF

      # El fork no tiene el proyecto Firebase del upstream. Sin este archivo falla
      # :app:processV8DebugGoogleServices; con IDs falsos Analytics no envía nada.
      - name: google-services.json del fork
        run: cp ci/google-services.json app/google-services.json

      - name: advzip (recompressApk)
        run: sudo apt-get update && sudo apt-get install -y advancecomp

      # AGP genera el keystore de debug con BouncyCastle y muere con
      # NoClassDefFoundError: org/bouncycastle/asn1/edec/EdECObjectIdentifiers.
      # Con el keystore ya creado, validateSigning no pasa por ese camino.
      - name: Caché del keystore de debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: novaide-debug-keystore-v1

      - name: Keystore de debug
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # En este runner AGP resuelve ~/.config/.android, no ~/.android.
          # ANDROID_USER_HOME es la primera variable que consulta.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -8

      - name: Validar firma
        run: ./gradlew :app:validateSigningV8Debug --no-daemon --max-workers=4

      - name: Descargar assets de runtime
        run: ./gradlew :app:assetsDownloadDebug --no-daemon --max-workers=4

      - name: Compilar APK y zip de assets
        run: ./gradlew :app:assembleV8Debug :app:assembleV8Assets --no-daemon --max-workers=4 --stacktrace

      - name: Localizar salidas
        id: outputs
        run: |
          apk=$(find app/build/outputs/apk -path "*v8*/debug/*.apk" | head -n 1)
          assets=$(find app/build/outputs/assets -name "assets-arm64-v8a.zip" | head -n 1)
          test -n "$apk" || { echo "No se produjo ninguna APK"; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          ls -lh "$apk" "$assets"
          df -h /

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: novaide-v8-debug
          path: ${{ steps.outputs.outputs.apk }}
          compression-level: 0
          if-no-files-found: error

      - name: Subir zip de assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_assets_zip }}
        uses: actions/upload-artifact@v4
        with:
          name: novaide-assets-arm64-v8a
          path: ${{ steps.outputs.outputs.assets }}
          compression-level: 0
          if-no-files-found: error

      # El zip de 1.1 GB lo sube el runner, no la conexión del usuario.
      - name: Publicar release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          cp "${{ steps.outputs.outputs.apk }}" NovaIDE-arm64-debug.apk
          cp "${{ steps.outputs.outputs.assets }}" assets-arm64-v8a.zip
          cat > "$RUNNER_TEMP/notas.md" <<'EOF'
          IDE de Android para el teléfono. Fork de CodeOnTheGo con marca NovaIDE e interfaz en español latino. Versión de prueba; la compilación se verifica en CI y la prueba completa en el teléfono sigue pendiente.

          ## Archivos
          - `NovaIDE-arm64-debug.apk` — la app (arm64-v8a, Android 9 o superior).
          - `assets-arm64-v8a.zip` — el entorno de ejecución (Gradle, JDK, SDK de Android, bootstrap de Termux). La APK debug no lo trae adentro, hay que bajarlo aparte.

          ## Instalación
          1. Bajá `assets-arm64-v8a.zip` y dejalo en `/sdcard/Download/assets-arm64-v8a.zip`, con ese nombre exacto, suelto en Download y **sin descomprimir**.
          2. Instalá la APK (habilitá orígenes desconocidos si lo pide).
          3. Abrí NovaIDE. Importa el entorno de ejecución sola en el primer arranque; tarda un rato.

          Si aparece el cartel "Assets file not found", el zip no está en esa ruta o tiene otro nombre.

          ## Notas
          - `targetSdk` queda en 28 a propósito: desde Android 10 con target 29+ el sistema prohíbe ejecutar binarios que la app escribe, y eso rompería Gradle, el JDK y la terminal integrados.
          - El paquete sigue siendo `com.itsaky.androidide` para conservar los datos y la compatibilidad con el upstream.
          - Build debug firmada con la clave de debug del CI. Sirve para instalar y actualizar entre builds de este fork.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "NovaIDE $TAG" --prerelease \
            --notes-file "$RUNNER_TEMP/notas.md" NovaIDE-arm64-debug.apk assets-arm64-v8a.zip