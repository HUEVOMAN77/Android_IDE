name: Recuperar firma original de NovaIDE

on:
  push:
    branches:
      - novaide/inicio
    paths:
      - .github/workflows/novaide-signing-recovery.yml
      - ci/signing-recovery.crt

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: novaide-debug-keystore-v1
      - name: Verificar y cifrar la clave original
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android > "$RUNNER_TEMP/cert.der"
          fingerprint=$(openssl x509 -inform DER -in "$RUNNER_TEMP/cert.der" -noout -fingerprint -sha256 | cut -d= -f2)
          test "$fingerprint" = "A8:D0:B1:5F:1C:65:67:9D:1E:96:C3:61:74:D3:4D:2E:CB:36:D5:71:53:DA:2D:17:E6:A3:E7:9A:8D:A6:71:04"
          openssl cms -encrypt -binary -aes256 -in "$HOME/.android/debug.keystore" \
            -out "$RUNNER_TEMP/keystore.p7m" -outform DER ci/signing-recovery.crt
      - uses: actions/upload-artifact@v4
        with:
          name: novaide-signing-recovery
          path: ${{ runner.temp }}/keystore.p7m
          retention-days: 1
          if-no-files-found: error
